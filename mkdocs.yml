site_name: Netcat for Mere Mortals
site_description: Plain-language netcat. The socket in plain words, talking to a service by hand, HTTP typed out yourself, listening and chatting, checking ports by exit code, moving one file and proving it arrived, UDP with its shrug, and the timeouts that end the hang, all practised on a loopback lab.
site_url: https://paulsullivan33-dev.github.io/netcat-for-mere-mortals/

